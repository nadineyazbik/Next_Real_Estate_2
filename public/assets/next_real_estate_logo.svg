<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Drop shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
    </filter>

    <!-- Path for curved upper text "Next" and "Real Estate" -->
    <path id="curveNext" d="M 120,185 A 160,160 0 0,1 380,185" fill="none"/>
    <path id="curveRealEstate" d="M 100,210 A 185,185 0 0,1 400,210" fill="none"/>
    <path id="curvePhone" d="M 140,240 A 190,190 0 0,1 360,240" fill="none"/>
  </defs>

  <!-- Outer Black Bezel Ring -->
  <circle cx="250" cy="250" r="240" fill="#141517" stroke="#323438" stroke-width="4"/>
  <circle cx="250" cy="250" r="226" fill="#2a2825" stroke="#4a4640" stroke-width="2"/>

  <!-- Cream / Warm Parchment Paper Disc -->
  <circle cx="250" cy="250" r="220" fill="#f4ede0" stroke="#dfd4c0" stroke-width="3"/>
  <circle cx="250" cy="250" r="217" fill="none" stroke="#cfc3ad" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- TOP BRANDING TEXT -->
  <!-- "Next" -->
  <text font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="900" fill="#3b2b1d" letter-spacing="1">
    <textPath href="#curveNext" startOffset="50%" text-anchor="middle">
      Next
    </textPath>
  </text>

  <!-- "Real Estate" -->
  <text font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" fill="#3b2b1d" letter-spacing="1">
    <textPath href="#curveRealEstate" startOffset="50%" text-anchor="middle">
      Real Estate
    </textPath>
  </text>

  <!-- Phone 76743414 + WhatsApp Icon -->
  <g transform="translate(195, 230)">
    <text font-family="'Prompt', sans-serif" font-size="21" font-weight="700" fill="#3b2b1d" letter-spacing="1">
      76743414
    </text>
    <!-- WhatsApp green badge -->
    <g transform="translate(100, -16)">
      <circle cx="10" cy="10" r="9.5" fill="#25D366" stroke="#ffffff" stroke-width="1"/>
      <path d="M 6.5 13.5 L 7 11.5 C 6.5 10.6 6.3 9.6 6.5 8.6 C 7 6.8 8.6 5.5 10.5 5.5 C 12.8 5.5 14.5 7.2 14.5 9.5 C 14.5 11.8 12.8 13.5 10.5 13.5 C 9.5 13.5 8.6 13.2 7.8 12.8 Z" fill="#ffffff"/>
      <path d="M 8.6 8.2 C 8.4 7.9 8.2 7.9 8 7.9 C 7.8 7.9 7.6 8 7.5 8.2 C 7.2 8.5 6.7 9 6.7 9.8 C 6.7 10.7 7.3 11.5 7.5 11.7 C 7.6 11.8 8.7 13.6 10.5 14.3 C 12 14.8 12.3 14.6 12.7 14.5 C 13.1 14.4 13.9 13.9 14.1 13.4 C 14.3 12.8 14.3 12.3 14.2 12.2 C 14.1 12.1 13.9 12 13.6 11.9 C 13.3 11.7 12 11.1 11.8 11 C 11.5 10.9 11.3 10.8 11.2 11.1 C 11 11.3 10.6 11.8 10.4 12 C 10.3 12.1 10.1 12.2 9.9 12.1 C 9.6 12 8.8 11.7 7.9 10.8 C 7.2 10.1 6.7 9.3 6.6 9 C 6.5 8.8 6.6 8.6 6.7 8.5 C 6.8 8.4 7 8.2 7.1 8 C 7.2 7.9 7.3 7.8 7.4 7.6" fill="#25D366" stroke="#25D366" stroke-width="0.3"/>
    </g>
  </g>

  <!-- CENTER LAYERED CIRCLE (Aperture / Sunken Diorama) -->
  <g transform="translate(0, 30)">
    <!-- Shadowed Ring -->
    <circle cx="250" cy="250" r="120" fill="#e8dfce" stroke="#cfc3ab" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Sky background inside circle -->
    <circle cx="250" cy="250" r="117" fill="#f0ebe0"/>

    <!-- Left Flanking Lebanese Cedar / Pine Trees (Layered Green) -->
    <!-- Tree 1 Left Far -->
    <g fill="#4e6f49">
      <polygon points="175,250 162,275 188,275"/>
      <polygon points="175,268 158,295 192,295"/>
      <polygon points="175,288 153,320 197,320"/>
      <rect x="172" y="320" width="6" height="25" fill="#384f34"/>
    </g>
    <!-- Tree 2 Left Closer -->
    <g fill="#5c8056">
      <polygon points="198,245 186,268 210,268"/>
      <polygon points="198,263 181,288 215,288"/>
      <polygon points="198,282 176,312 220,312"/>
      <rect x="195" y="312" width="6" height="30" fill="#384f34"/>
    </g>

    <!-- Right Flanking Lebanese Cedar / Pine Trees -->
    <!-- Tree 1 Right Far -->
    <g fill="#4e6f49">
      <polygon points="325,250 312,275 338,275"/>
      <polygon points="325,268 308,295 342,295"/>
      <polygon points="325,288 303,320 347,320"/>
      <rect x="322" y="320" width="6" height="25" fill="#384f34"/>
    </g>
    <!-- Tree 2 Right Closer -->
    <g fill="#5c8056">
      <polygon points="302,245 290,268 314,268"/>
      <polygon points="302,263 285,288 319,288"/>
      <polygon points="302,282 280,312 324,312"/>
      <rect x="299" y="312" width="6" height="30" fill="#384f34"/>
    </g>

    <!-- Center High-Rise Architectural Buildings / Towers (Sage / Forest Green) -->
    <!-- Left Mid Tower -->
    <rect x="210" y="220" width="22" height="125" fill="#587954" rx="1"/>
    <!-- Center Tallest Tower -->
    <rect x="235" y="175" width="30" height="170" fill="#4d6d4a" rx="1"/>
    <!-- Right Mid Tower -->
    <rect x="268" y="205" width="24" height="140" fill="#587954" rx="1"/>
    <!-- Far Right Tower -->
    <rect x="294" y="240" width="18" height="105" fill="#698b64" rx="1"/>

    <!-- Architectural Window Grid Cuts (Cream Color) -->
    <!-- Center Tower Windows -->
    <g fill="#f2ede4">
      <!-- Row 1 -->
      <rect x="240" y="190" width="4" height="5" rx="0.5"/>
      <rect x="248" y="190" width="4" height="5" rx="0.5"/>
      <rect x="256" y="190" width="4" height="5" rx="0.5"/>
      <!-- Row 2 -->
      <rect x="240" y="202" width="4" height="5" rx="0.5"/>
      <rect x="248" y="202" width="4" height="5" rx="0.5"/>
      <rect x="256" y="202" width="4" height="5" rx="0.5"/>
      <!-- Row 3 -->
      <rect x="240" y="214" width="4" height="5" rx="0.5"/>
      <rect x="248" y="214" width="4" height="5" rx="0.5"/>
      <rect x="256" y="214" width="4" height="5" rx="0.5"/>
      <!-- Row 4 -->
      <rect x="240" y="226" width="4" height="5" rx="0.5"/>
      <rect x="248" y="226" width="4" height="5" rx="0.5"/>
      <rect x="256" y="226" width="4" height="5" rx="0.5"/>
      <!-- Row 5 -->
      <rect x="240" y="238" width="4" height="5" rx="0.5"/>
      <rect x="248" y="238" width="4" height="5" rx="0.5"/>
      <rect x="256" y="238" width="4" height="5" rx="0.5"/>
      <!-- Row 6 -->
      <rect x="240" y="250" width="4" height="5" rx="0.5"/>
      <rect x="248" y="250" width="4" height="5" rx="0.5"/>
      <rect x="256" y="250" width="4" height="5" rx="0.5"/>
      <!-- Row 7 -->
      <rect x="240" y="262" width="4" height="5" rx="0.5"/>
      <rect x="248" y="262" width="4" height="5" rx="0.5"/>
      <rect x="256" y="262" width="4" height="5" rx="0.5"/>
      <!-- Row 8 -->
      <rect x="240" y="274" width="4" height="5" rx="0.5"/>
      <rect x="248" y="274" width="4" height="5" rx="0.5"/>
      <rect x="256" y="274" width="4" height="5" rx="0.5"/>
    </g>

    <!-- Left Tower Windows -->
    <g fill="#f2ede4">
      <rect x="214" y="232" width="3.5" height="4.5"/>
      <rect x="221" y="232" width="3.5" height="4.5"/>
      <rect x="214" y="244" width="3.5" height="4.5"/>
      <rect x="221" y="244" width="3.5" height="4.5"/>
      <rect x="214" y="256" width="3.5" height="4.5"/>
      <rect x="221" y="256" width="3.5" height="4.5"/>
      <rect x="214" y="268" width="3.5" height="4.5"/>
      <rect x="221" y="268" width="3.5" height="4.5"/>
    </g>

    <!-- Right Tower Windows -->
    <g fill="#f2ede4">
      <rect x="273" y="218" width="3.5" height="4.5"/>
      <rect x="281" y="218" width="3.5" height="4.5"/>
      <rect x="273" y="230" width="3.5" height="4.5"/>
      <rect x="281" y="230" width="3.5" height="4.5"/>
      <rect x="273" y="242" width="3.5" height="4.5"/>
      <rect x="281" y="242" width="3.5" height="4.5"/>
      <rect x="273" y="254" width="3.5" height="4.5"/>
      <rect x="281" y="254" width="3.5" height="4.5"/>
      <rect x="273" y="266" width="3.5" height="4.5"/>
      <rect x="281" y="266" width="3.5" height="4.5"/>
    </g>
  </g>

  <!-- BOTTOM SECTION: GOLDEN / BRONZE LEBANESE CEDAR TREE (أرزة لبنان) -->
  <g transform="translate(250, 410) scale(1.05)" filter="url(#shadow)">
    <!-- Cedar Foliage Silhouette with Layered Horizontal Spread -->
    <!-- Tier 1 (Apex) -->
    <path d="M 0,-48 L -14,-36 L -8,-36 L -20,-24 L -12,-24 L -28,-10 L 28,-10 L 12,-24 L 20,-24 L 8,-36 L 14,-36 Z" fill="#8c6d3b"/>
    <!-- Tier 2 -->
    <path d="M 0,-34 L -32,-8 L -22,-8 L -42,10 L 42,10 L 22,-8 L 32,-8 Z" fill="#9e7c44"/>
    <!-- Tier 3 (Wide Base) -->
    <path d="M 0,-15 L -48,12 L -34,12 L -56,28 L 56,28 L 34,12 L 48,12 Z" fill="#846635"/>
    <!-- Trunk and Root Spread -->
    <path d="M -5,26 L -5,40 L -12,45 L 12,45 L 5,40 L 5,26 Z" fill="#694f27"/>
  </g>
</svg>
